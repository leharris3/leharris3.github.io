<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0a0d" />
    <title>buzz in</title>
    <style>
      :root {
        --bg: #0a0a0d;
        --red: #e01b24;
        --red-hi: #ff6b63;
        --red-lo: #6d0d13;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overscroll-behavior: none;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        background: radial-gradient(circle at 50% 42%, #1b1b23 0%, var(--bg) 62%);
        color: #f5f5f7;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition: background 0.25s ease;
      }

      body.is-buzzing {
        background: radial-gradient(circle at 50% 42%, #4a1015 0%, var(--bg) 62%);
      }

      /* ---- the buzzer ---- */

      .buzzer {
        --size: min(74vw, 52vh, 400px);
        position: relative;
        width: var(--size);
        height: var(--size);
        flex: none;
        padding: calc(var(--size) * 0.055);
        border: 0;
        border-radius: 50%;
        background: linear-gradient(#3a3a45, #16161c 55%, #0d0d11);
        box-shadow:
          0 calc(var(--size) * 0.05) calc(var(--size) * 0.09) rgba(0, 0, 0, 0.65),
          inset 0 2px 1px rgba(255, 255, 255, 0.22),
          inset 0 -3px 4px rgba(0, 0, 0, 0.6);
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .buzzer:focus-visible {
        outline: 3px solid #7aa2ff;
        outline-offset: 6px;
      }

      .dome {
        display: block;
        position: relative; /* anchor the highlight to the dome, not the housing,
                               so pressing (which transforms .dome) doesn't shift it */
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 34% 26%, var(--red-hi) 0%, var(--red) 38%, #a5121a 72%, var(--red-lo) 100%);
        box-shadow:
          0 calc(var(--size) * 0.035) 0 #56070d,
          0 calc(var(--size) * 0.05) calc(var(--size) * 0.06) rgba(0, 0, 0, 0.55),
          inset 0 calc(var(--size) * -0.05) calc(var(--size) * 0.07) rgba(0, 0, 0, 0.45),
          inset 0 calc(var(--size) * 0.03) calc(var(--size) * 0.05) rgba(255, 255, 255, 0.28);
        transition:
          transform 0.06s ease-out,
          box-shadow 0.06s ease-out;
      }

      /* specular highlight */
      .dome::after {
        content: "";
        position: absolute;
        top: 12%;
        left: 20%;
        width: 40%;
        height: 26%;
        border-radius: 50%;
        background: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
        filter: blur(calc(var(--size) * 0.012));
        pointer-events: none;
      }

      .buzzer.is-down .dome {
        transform: translateY(calc(var(--size) * 0.032)) scale(0.985);
        box-shadow:
          0 calc(var(--size) * 0.004) 0 #56070d,
          0 calc(var(--size) * 0.012) calc(var(--size) * 0.025) rgba(0, 0, 0, 0.5),
          inset 0 calc(var(--size) * -0.03) calc(var(--size) * 0.06) rgba(0, 0, 0, 0.55),
          inset 0 calc(var(--size) * 0.02) calc(var(--size) * 0.04) rgba(255, 255, 255, 0.2);
      }

      /* ---- text ---- */

      .hint {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(245, 245, 247, 0.42);
        transition: color 0.2s ease;
      }

      body.is-buzzing .hint {
        color: rgba(255, 138, 130, 0.95);
      }

      .note {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(0.85rem, env(safe-area-inset-bottom));
        margin: 0;
        text-align: center;
        font-size: 0.7rem;
        color: rgba(245, 245, 247, 0.2);
      }

      @media (prefers-reduced-motion: reduce) {
        .dome,
        body {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <button id="buzzer" class="buzzer" type="button" aria-label="Buzz in">
      <span class="dome"></span>
    </button>

    <p class="hint" id="hint">tap to buzz in</p>
    <p class="note">no sound? check your ringer / silent switch</p>

    <script>
      (function () {
        var SRC = "{{ '/assets/audio/buzzer.mp3' | relative_url }}";
        var btn = document.getElementById("buzzer");
        var hint = document.getElementById("hint");

        // Plain <audio> is the always-works path; Web Audio (below) takes over
        // once decoded because it retriggers with no latency.
        var el = new Audio(SRC);
        el.preload = "auto";

        var ctx = null;
        var buffer = null;
        var current = null;

        // iOS 16.4+: play through the silent switch instead of being muted by it.
        try {
          if (navigator.audioSession) navigator.audioSession.type = "playback";
        } catch (e) {}

        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          try {
            ctx = new AC();
            fetch(SRC)
              .then(function (r) {
                return r.arrayBuffer();
              })
              .then(function (raw) {
                return new Promise(function (resolve, reject) {
                  // Older Safari only supports the callback form.
                  var p = ctx.decodeAudioData(raw, resolve, reject);
                  if (p && p.then) p.then(resolve, reject);
                });
              })
              .then(function (decoded) {
                buffer = decoded;
              })
              .catch(function () {
                buffer = null;
              });
          } catch (e) {
            ctx = null;
          }
        }

        function buzz() {
          if (ctx && buffer) {
            if (ctx.state === "suspended") ctx.resume();
            try {
              if (current) current.stop();
            } catch (e) {}
            var src = ctx.createBufferSource();
            src.buffer = buffer;
            src.connect(ctx.destination);
            src.start(0);
            current = src;
          } else {
            try {
              el.currentTime = 0;
            } catch (e) {}
            var play = el.play();
            if (play && play.catch) play.catch(function () {});
          }

          try {
            if (navigator.vibrate) navigator.vibrate(60);
          } catch (e) {}

          document.body.classList.add("is-buzzing");
          hint.textContent = "buzzed!";
          clearTimeout(buzz._t);
          buzz._t = setTimeout(function () {
            document.body.classList.remove("is-buzzing");
            hint.textContent = "tap to buzz in";
          }, 900);
        }

        // Keep the screen on so the buzzer stays one tap away between rounds.
        var lock = null;
        function keepAwake() {
          if (!navigator.wakeLock) return;
          navigator.wakeLock
            .request("screen")
            .then(function (l) {
              lock = l;
            })
            .catch(function () {});
        }
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && !lock) keepAwake();
        });

        // pointerdown, not click: fires the instant a finger lands.
        btn.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          btn.classList.add("is-down");
          if (ctx && ctx.state === "suspended") ctx.resume();
          keepAwake();
          buzz();
        });

        function release() {
          btn.classList.remove("is-down");
        }
        btn.addEventListener("pointerup", release);
        btn.addEventListener("pointercancel", release);
        btn.addEventListener("pointerleave", release);

        // Keyboard / accessibility path (pointerdown already covers mouse+touch).
        btn.addEventListener("keydown", function (e) {
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            btn.classList.add("is-down");
            buzz();
          }
        });
        btn.addEventListener("keyup", release);

        btn.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });
      })();
    </script>
  </body>
</html>
